[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
cache_dir = ../.cache/server/pytest
markers =
    slow: launches a real agent session or otherwise costs minutes — FAC-FIX-351's boundary case
    repository: reads this repository's own documents rather than a fixture — `pytest tests/ -m repository` is the whole of the document gate, run on `main` after every merge (FAC-FIX-242)
